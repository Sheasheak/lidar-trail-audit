<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<title>Create an account — TrailSafe</title>
<link rel="stylesheet" href="{{ url_for('static', filename='audit.css') }}">
</head>
<body>
<div class="sheet" style="max-width:480px">

  <header class="titleblock">
    <p class="eyebrow"><span>TrailSafe</span><span>Create an account</span><a href="{{ url_for('index') }}" style="margin-left:auto">← Home</a></p>
    <h1>Create an account</h1>
    <p class="subtitle">Save your audit history so you can come back to past runs instead of re-uploading each time.</p>
  </header>

  {% if error %}
  <div class="errorbox" role="alert"><b>Couldn't create that account</b>{{ error }}</div>
  {% endif %}

  <form method="post" action="{{ url_for('auth.signup') }}" style="margin-top:24px">
    <div class="formgrid">
      <div class="fieldrow">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>
      </div>
      <div class="fieldrow">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" required>
        <span class="hint">At least 8 characters.</span>
      </div>
      <button type="submit" class="primary">Create account</button>
    </div>
  </form>

  <p class="hint" style="margin-top:18px">
    Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
  </p>

</div>
</body>
</html>
