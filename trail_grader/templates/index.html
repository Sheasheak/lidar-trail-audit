<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<title>NZ MTB Trail Grader</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:sans-serif;background:#f0f2f5;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .card{background:white;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);padding:40px;max-width:480px;width:90%;}
  h1{font-size:22px;margin-bottom:6px;}
  .sub{color:#666;font-size:13px;margin-bottom:28px;}
  .drop-zone{border:2px dashed #ccc;border-radius:8px;padding:36px;text-align:center;cursor:pointer;transition:all .2s;position:relative;}
  .drop-zone:hover,.drop-zone.drag{border-color:#0044cc;background:#f0f4ff;}
  .drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .drop-zone .icon{font-size:36px;margin-bottom:8px;}
  .drop-zone .label{font-size:14px;color:#444;}
  .drop-zone .hint{font-size:12px;color:#999;margin-top:4px;}
  #file-name{margin-top:10px;font-size:13px;color:#0044cc;text-align:center;min-height:18px;}
  .btn{display:block;width:100%;margin-top:20px;padding:12px;background:#0044cc;color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;}
  .btn:hover{background:#0033aa;}
  .btn:disabled{background:#aaa;cursor:not-allowed;}
  .error{margin-top:14px;padding:10px 14px;background:#fff0f0;border:1px solid #ffcccc;border-radius:6px;color:#cc0000;font-size:13px;display:none;}
  .spinner{display:none;text-align:center;margin-top:16px;color:#666;font-size:13px;}
  .spinner::before{content:'';display:inline-block;width:16px;height:16px;border:2px solid #ccc;border-top-color:#0044cc;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="card">
  <h1>NZ MTB Trail Grader</h1>
  <p class="sub">Upload a KML trail file to automatically grade it against the NZ MTB Trail Design & Construction Guidelines (2022).</p>

  <form id="upload-form" action="/grade" method="post" enctype="multipart/form-data">
    <div class="drop-zone" id="drop-zone">
      <input type="file" name="kml" accept=".kml" id="file-input" required>
      <div class="icon">📁</div>
      <div class="label">Drop KML file here or click to browse</div>
      <div class="hint">Trailforks KML export supported</div>
    </div>
    <div id="file-name"></div>

    {% if error %}
    <div class="error" style="display:block">{{ error }}</div>
    {% endif %}

    <button class="btn" type="submit" id="submit-btn">Grade Trail</button>
    <div class="spinner" id="spinner">Fetching elevation data from LINZ...</div>
  </form>
</div>

<script>
  const input = document.getElementById('file-input');
  const fname = document.getElementById('file-name');
  const zone  = document.getElementById('drop-zone');
  const btn   = document.getElementById('submit-btn');
  const spin  = document.getElementById('spinner');

  input.addEventListener('change', () => {
    fname.textContent = input.files[0] ? input.files[0].name : '';
  });
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag');
    if (e.dataTransfer.files[0]) {
      input.files = e.dataTransfer.files;
      fname.textContent = e.dataTransfer.files[0].name;
    }
  });

  document.getElementById('upload-form').addEventListener('submit', () => {
    btn.disabled = true;
    btn.textContent = 'Processing...';
    spin.style.display = 'block';
  });
</script>
</body>
</html>
